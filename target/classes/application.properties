# --------------------------------------------------------------------------
# Server
# --------------------------------------------------------------------------
server.port=8080
server.hostname=${HOSTNAME:local}

# --------------------------------------------------------------------------
# Datasource - values are injected as environment variables from the ECS
# Task Definition (which in turn should pull the DB password from Secrets
# Manager / SSM Parameter Store, never hardcode credentials).
#
# DB_HOST     -> RDS endpoint (e.g. mydb.xxxxx.ap-south-1.rds.amazonaws.com)
# DB_PORT     -> 3306 for MySQL / 5432 for PostgreSQL
# DB_NAME     -> database name
# DB_USERNAME -> master username
# DB_PASSWORD -> master password (inject via Secrets Manager in ECS)
# --------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:awsdemo}?useSSL=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --------------------------------------------------------------------------
# Actuator - used by the ALB target group health check and ECS container
# health check (path: /actuator/health)
# --------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# --------------------------------------------------------------------------
# Logging - plain text to stdout so the ECS awslogs driver ships it straight
# to CloudWatch Logs (no file logging needed in a container)
# --------------------------------------------------------------------------
logging.level.root=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

